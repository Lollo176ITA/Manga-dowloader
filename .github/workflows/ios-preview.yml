name: iOS preview IPA

concurrency:
  group: ios-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches:
      - ios
    paths:
      - 'ios-app/**'
      - 'android-app/shared/**'
      - 'android-app/gradle/**'
      - 'android-app/*.kts'
      - 'android-app/gradle.properties'
      - '.github/workflows/ios-preview.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    # BGContinuedProcessingTask richiede l'SDK di iOS 26: serve Xcode 26.
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      # Unico tag riusato a ogni build: l'updater Android legge solo le ultime 20 release
      # e /releases/latest, quindi l'IPA resta una pre-release che non le sposta.
      RELEASE_TAG: ios-preview
      IPA_NAME: MangApp.ipa
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Il modulo shared ha anche il target Android: Gradle vuole l'SDK già in configurazione.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('android-app/gradle/libs.versions.toml', 'android-app/**/*.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      # Il link Release del framework Kotlin/Native va in OutOfMemory con i 3 GB del progetto.
      - name: Raise Gradle heap for Kotlin/Native release link
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties

      - name: Run shared tests on iOS simulator
        working-directory: android-app
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Run Swift download core tests
        working-directory: ios-app
        run: swift test

      - name: Resolve version
        run: |
          MARKETING_VERSION="$(grep -m1 'MARKETING_VERSION = ' ios-app/MangApp.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);.*/\1/')"
          test -n "$MARKETING_VERSION" || { echo "Missing MARKETING_VERSION"; exit 1; }
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      # IPA non firmato: la firma la mette SideStore (o AltStore/Sideloadly) sul telefono.
      - name: Build unsigned IPA
        run: |
          xcodebuild -project ios-app/MangApp.xcodeproj -target MangApp \
            -configuration Release -sdk iphoneos ARCHS=arm64 \
            "CONFIGURATION_BUILD_DIR=$PWD/ios-app/build/device" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          test -x ios-app/build/device/MangApp.app/MangApp || { echo "MangApp binary missing"; exit 1; }
          rm -rf ios-app/build/ipa && mkdir -p ios-app/build/ipa/Payload
          cp -R ios-app/build/device/MangApp.app ios-app/build/ipa/Payload/
          (cd ios-app/build/ipa && zip -qry "../$IPA_NAME" Payload)
          test -s "ios-app/build/$IPA_NAME" || { echo "IPA is empty"; exit 1; }

      - name: Publish GitHub pre-release
        run: |
          NOTES="IPA non firmato $MARKETING_VERSION ($BUILD_NUMBER) dal branch ios, commit ${GITHUB_SHA::7}. Installalo con SideStore."
          # Ricrea la release così il tag punta al commit appena compilato.
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$RELEASE_TAG" "ios-app/build/$IPA_NAME#$IPA_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "iOS preview $MARKETING_VERSION ($BUILD_NUMBER)" \
            --notes "$NOTES" \
            --prerelease \
            --latest=false

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: mangapp-ios-preview
          path: ios-app/build/${{ env.IPA_NAME }}
          if-no-files-found: error
