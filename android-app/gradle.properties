org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Kotlin Multiplatform: i target iOS di :shared si compilano solo su macOS; su Windows/Linux
# vengono saltati senza errori (la fase iOS si fa sul Mac).
kotlin.native.ignoreDisabledTargets=true
